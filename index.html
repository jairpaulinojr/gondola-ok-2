<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gôndola OK - Operacional</title>
    
    <!-- Biblioteca Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            margin: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- O script.js vai preencher este espaço automaticamente ao carregar -->
        <div style="padding: 40px; text-align: center; color: #6c757d;">
            <h2>⏳ A carregar aplicação...</h2>
        </div>
    </div>

    <!-- Script Principal da Aplicação -->
    <script src="script.js"></script>
    <script>
        // Garante que o menu principal abre assim que a página carrega
        window.onload = function() {
            if (typeof voltarMenuPrincipal === "function") {
                voltarMenuPrincipal();
            } else {
                document.querySelector(".container").innerHTML = "<h3 style='color:red; text-align:center;'>Erro: Função voltarMenuPrincipal não encontrada no script.js</h3>";
            }
        };
    </script>
</body>
</html>
